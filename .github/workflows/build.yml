name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Версия
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Ключ подписи из секретов
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Сборка подписанного release
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/PhoneChecker-$VERSION_NAME.apk"

      - name: Сборка debug (секретов нет)
        if: env.HAS_KEY != 'true'
        run: |
          gradle --no-daemon assembleDebug
          mkdir -p out && cp app/build/outputs/apk/debug/app-debug.apk "out/PhoneChecker-$VERSION_NAME-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneChecker-apk
          path: out/*.apk

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
